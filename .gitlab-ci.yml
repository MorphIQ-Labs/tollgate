# Tollgate CI — Rust correctness, dependency advisories, backend parity,
# performance compilation, mutation assurance, and machine-checked proofs.
#
# The image tag matches rust-toolchain.toml; keep them in lockstep so rustup
# never downloads a second toolchain inside CI. Criterion and absolute-latency
# thresholds stay on a controlled host; shared CI compiles every benchmark and
# records the load test's like-for-like sequential and contended ratios as
# non-gating evidence.
#
# Every job carries `dependencies: []`. No job consumes another job's artifacts,
# and left implicit GitLab makes each later-stage job download every
# earlier-stage artifact. a sibling workspace lost its entire test stage to a 403 that
# way, fetching whitepaper PDFs nothing reads. `dependencies` controls downloads
# only; the mutation, perf and load jobs still publish their reports.
#
# Cache: Cargo sources and target artifacts are keyed by Cargo.lock plus the
# pinned toolchain. Clippy is the sole writer; later build jobs pull read-only,
# so parallel jobs cannot replace one another's archive. This self-managed
# runner has no distributed cache endpoint: runner operations own expiry and
# cleanup. Caching target/ restores the cross-job sharing lost with Woodpecker
# at the cost of one archive upload per merge-request pipeline.

image: rust:1.97.1-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # The release-preparation schedule. Nothing else runs on it: the
    # `.default-branch` rule excludes scheduled pipelines, so a schedule
    # cannot silently re-run the gates or re-enter `tag-release`.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

stages: [check, test, assurance, release]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.ci-cargo"
  CARGO_INSTALL_ROOT: "$CI_PROJECT_DIR/.ci-tools"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_TERM_COLOR: "always"

# The policy lives in one mapping so pull-only is the default for every
# consumer. The sole producer overrides only policy after inheriting the same
# key and paths.
.cargo-build-cache: &cargo-build-cache
  key:
    files:
      - Cargo.lock
      - rust-toolchain.toml
  paths:
    - .ci-cargo/registry/cache/
    - .ci-cargo/registry/index/
    - .ci-cargo/git/db/
    - target/
  policy: pull

.merge-request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never

.main-merge-request:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - when: never

.main-merge-request-manual:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

.default-branch:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
    - when: never

# The release-preparation lane: the schedule that opens the release merge
# request, plus a manual button on the default branch for cutting one now.
.release-prep:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

# Shared Postgres service wiring for every job that runs the env-gated suite.
# TOLLGATE_REQUIRE_PG makes the test harness fail red on a silent skip, so the
# gate cannot go green without a live database even if this YAML is refactored.
.postgres-service:
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_USER: tollgate
    POSTGRES_PASSWORD: tollgate
    POSTGRES_DB: tollgate
    TOLLGATE_PG_URL: postgres://tollgate:tollgate@postgres:5432/tollgate
    TOLLGATE_REQUIRE_PG: "1"

# Readiness wait the Woodpecker port dropped: the runner's implicit service
# check is docker-executor-only and TCP-only, so the job must wait until
# Postgres actually accepts connections (pg_isready) before testing against it.
.postgres-wait:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -p 5432 -U tollgate && break; sleep 1; done
    - pg_isready -h postgres -p 5432 -U tollgate || { echo "Postgres service not accepting connections after 60s" >&2; exit 1; }

commit-convention:
  dependencies: []
  extends: .merge-request
  stage: check
  image: alpine:3.21
  interruptible: true
  script:
    - |
      types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
      if printf '%s' "$CI_MERGE_REQUEST_TITLE" | grep -qE "^($types)(\([a-z0-9._/-]+\))?!?: .+"; then
        printf 'conventional title: %s\n' "$CI_MERGE_REQUEST_TITLE"
      else
        printf 'Merge request title is not a conventional commit: %s\n' "$CI_MERGE_REQUEST_TITLE" >&2
        exit 1
      fi

repository-hygiene:
  dependencies: []
  extends: .merge-request
  stage: check
  # The workspace's slim compiler image intentionally omits Git.
  image: rust:1.97.1-bookworm
  interruptible: true
  script:
    - |
      tracked_ignored="$(git ls-files -ci --exclude-standard)"
      if [ -n "$tracked_ignored" ]; then
        printf 'Generated or ignored files are tracked:\n%s\n' "$tracked_ignored" >&2
        exit 1
      fi
    - |
      # #46 was a registry *list* — `publish = ["private-registry"]` — from which
      # tooling derives `cargo package --registry <name>`; the name resolved
      # nowhere and every main pipeline failed. The plain `publish = false` is a
      # different thing and is required: it is what refuses a stray
      # `cargo publish`. Reject only the list form, in any manifest — a member
      # inheriting it would evade a workspace-only check.
      publish_lists="$(git grep -n '^[[:space:]]*publish[[:space:]]*=[[:space:]]*\[' -- '*Cargo.toml' || true)"
      if [ -n "$publish_lists" ]; then
        printf 'Cargo manifests must not carry a publish registry list (see AGENTS.md, issue #46):\n%s\n' "$publish_lists" >&2
        exit 1
      fi

fmt:
  dependencies: []
  extends: .merge-request
  stage: check
  interruptible: true
  script:
    - cargo fmt --check

clippy:
  dependencies: []
  extends: .merge-request
  stage: check
  interruptible: true
  cache:
    <<: *cargo-build-cache
    policy: pull-push
  script:
    - rustc --version
    - cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

# Cargo.lock makes this a reproducible whole-tree scan. Run it on both merge
# requests and the default branch so a newly published advisory blocks the next
# change immediately and also withdraws a just-merged revision from release.
audit:
  dependencies: []
  stage: check
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  before_script:
    - export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
    - cargo install --locked --no-default-features cargo-audit --version "$(cat .cargo/audit-version)" --root "$CARGO_INSTALL_ROOT"
  script:
    - ./scripts/check_advisories.sh

# `rust-toolchain.toml` pins the development toolchain and overrides a
# container's default toolchain. Select the declared minimum explicitly so
# this job cannot silently install and test with the newer pinned compiler.
msrv:
  dependencies: []
  extends: .merge-request
  stage: check
  image: rust:1.89.0-slim
  interruptible: true
  variables:
    RUSTUP_TOOLCHAIN: "1.89.0"
  script:
    - rustc --version
    - cargo --version
    - cargo check --locked --workspace --all-features --all-targets

test:
  dependencies: []
  extends: .merge-request
  stage: test
  interruptible: true
  cache: *cargo-build-cache
  script:
    - cargo test --locked --workspace --all-features

# The service library remains backend-generic when the binary's optional
# Postgres backend is disabled. The tree check makes that architecture claim
# executable; the test run covers the complete workspace in that feature mode.
test-no-default-features:
  dependencies: []
  extends: .merge-request
  stage: test
  interruptible: true
  cache: *cargo-build-cache
  script:
    - |
      dependency_tree="$(cargo tree --locked -p tollgate-server --no-default-features)"
      printf '%s\n' "$dependency_tree"
      if printf '%s\n' "$dependency_tree" | grep -Eq 'tollgate-store-postgres|sqlx'; then
        printf 'tollgate-server without default features must not depend on Postgres or sqlx\n' >&2
        exit 1
      fi
    - cargo test --locked --workspace --no-default-features

# First-class Postgres coverage: the env-gated suite that silently skips on
# dev machines runs for real here, against a service container — the
# backend-parity gate (mirrors tollgate-store's memory suite by scenario).
test-postgres:
  dependencies: []
  extends: [.merge-request, .postgres-service]
  stage: test
  interruptible: true
  cache: *cargo-build-cache
  before_script: !reference [.postgres-wait, before_script]
  script:
    - test -n "$TOLLGATE_PG_URL" || { echo "TOLLGATE_PG_URL is unset; this gate must not pass without a database" >&2; exit 1; }
    - cargo test --locked -p tollgate-store-postgres

bench-compile:
  dependencies: []
  extends: .merge-request
  stage: test
  interruptible: true
  cache: *cargo-build-cache
  script:
    - cargo bench --locked --workspace --no-run

formal:
  dependencies: []
  extends: .main-merge-request
  stage: assurance
  interruptible: true
  variables:
    ELAN_HOME: $CI_PROJECT_DIR/.ci-elan
  cache:
    key:
      files:
        - formal/lean/lean-toolchain
    paths:
      - .ci-elan
      - formal/lean/.lake
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
    - curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh | sh -s -- -y --default-toolchain "$(cat formal/lean/lean-toolchain)"
    - export PATH="$ELAN_HOME/bin:$PATH"
  script:
    - ./scripts/check_formal.sh

mutation:
  dependencies: []
  extends: [.main-merge-request, .postgres-service]
  stage: assurance
  timeout: 90 minutes
  interruptible: true
  cache: *cargo-build-cache
  before_script:
    - !reference [.postgres-wait, before_script]
    # The slim Rust image does not include git; diff-scoped mutation selection
    # requires it before any Rust tooling is worth installing.
    - apt-get update && apt-get install -y --no-install-recommends git
    - command -v git
    - export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
    - cargo install --locked cargo-mutants --version "$(cat .cargo/mutants-version)"
    - cargo install --locked cargo-nextest --version "$(cat .cargo/nextest-version)"
  script:
    - ./scripts/check_mutations.sh --diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  artifacts:
    when: always
    paths:
      - reports/mutations

# Criterion latency is meaningful only on a controlled host. This lane stays
# visible on default-target MRs for deliberate evidence collection, but is not
# a merge gate; benchmark compilation remains required in the test stage.
perf-thresholds:
  dependencies: []
  extends: .main-merge-request-manual
  stage: assurance
  allow_failure: true
  timeout: 45 minutes
  cache: *cargo-build-cache
  script:
    - ./scripts/check_perf_thresholds.sh
  artifacts:
    when: always
    paths:
      - reports/perf_gate_report.json

load-thresholds:
  dependencies: []
  extends: .main-merge-request
  stage: assurance
  interruptible: true
  timeout: 45 minutes
  cache: *cargo-build-cache
  # Mutation and formal assurance are CPU- and memory-intensive. This job
  # measures paired latencies on the same group-runner host, so wait for both
  # instead of letting our own pipeline contaminate its denominator/numerator.
  needs:
    - job: mutation
      artifacts: false
    - job: formal
      artifacts: false
  script:
    # The CI manifest explicitly disables host-dependent absolute ceilings;
    # paired ratios remain useful evidence, but a shared host can contaminate
    # their denominator and numerator differently (#49). Evidence mode records
    # a threshold miss without tainting the pipeline; build, configuration,
    # execution, and report failures still fail this job.
    - ./scripts/check_load_thresholds.sh --evidence testing/load_thresholds_ci.json reports/load_gate_report.json
  artifacts:
    when: always
    paths:
      - reports/load_gate_report.json

# Advances the version; `tag-release` below publishes whatever version the
# manifest declares. Splitting it this way is what release-plz did, and dropping
# release-plz took this half with it: for six commits after v0.5.0 — one of them
# breaking — `tag-release` reported "already exists; nothing to do" on every
# push and the repository looked healthy while releasing nothing.
#
# Idempotent: with no releasable commits it exits 0 having done nothing, so the
# schedule is quiet until there is something to release. It keeps one long-lived
# `chore/release` branch and refreshes the open merge request in place, so the
# proposed version always reflects the current tip of the default branch.
prepare-release:
  dependencies: []
  extends: .release-prep
  stage: release
  interruptible: false
  resource_group: release
  variables:
    # Tags are how the script finds the last release; a shallow clone has none.
    GIT_DEPTH: "0"
    # The group CI/CD variable keeps the name RELEASE_PLZ_TOKEN; it is an
    # ordinary Maintainer project token.
    RELEASE_TOKEN: $RELEASE_PLZ_TOKEN
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git curl jq ca-certificates
  script:
    - ./scripts/prepare-release.sh

# Bump the workspace version and the CHANGELOG section in an ordinary merge
# request; this cuts the tag and the GitLab release when it lands.
#
# Replaces release-plz. Not because release-plz failed here — it worked — but
# because it cannot work in the server project, a sibling workspace or a sibling workspace
# (`cargo package` needs every dependency to resolve on crates.io, and internal
# crates never publish), and one release model across the group beats a working
# exception. It also cost 9.5 minutes a pipeline to produce what this does in
# seconds.
#
# #46's lesson survives the swap: the failure it describes was latent because the
# release job runs only on main. This job has no configuration for a merge
# request to get wrong — the version comes from the manifest and the notes from
# the changelog — and `repository-hygiene` still rejects a manifest registry list
# on every merge request.
tag-release:
  dependencies: []
  extends: .default-branch
  stage: release
  image: alpine:3.21
  interruptible: false
  resource_group: release
  variables:
    GIT_DEPTH: "0"
    # The group CI/CD variable keeps the name RELEASE_PLZ_TOKEN; it is an
    # ordinary Maintainer project token.
    RELEASE_TOKEN: $RELEASE_PLZ_TOKEN
  before_script:
    - apk add --no-cache git curl jq
  script:
    - ./scripts/tag-release.sh
