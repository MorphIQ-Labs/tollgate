# Publishes the documentation site (book.toml, built from docs/) to GitHub
# Pages: https://morphiq-labs.github.io/tollgate/
#
# Runs from main only, so the site always describes the released tree. Pull
# requests build the same site in ci.yml's `check / docs` job, which is where
# a broken link fails; this workflow only publishes what that job accepted.
#
# Third-party actions are pinned to full commit SHAs; the comment names the
# release. mdBook's version comes from .cargo/mdbook-version.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: pages / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tools
          save-if: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: cargo install --locked mdbook --version "$(cat .cargo/mdbook-version)"
      - run: mdbook build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    name: pages / deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
