# Virtual workspace manifest. Every member inherits version/edition/license and
# the private-registry publication guard from [workspace.package]. Distribution
# remains by git tag; release-plz is configured in git-only mode.
[workspace]
resolver = "3"
members = [
    "crates/tollgate-admission",
    "crates/tollgate-auth",
    "crates/tollgate-client",
    "crates/tollgate-core",
    "crates/tollgate-perf-gate",
    "crates/tollgate-server",
    "crates/tollgate-store",
    "crates/tollgate-store-postgres",
    "examples/pricing-api",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.89"
authors = ["MorphIQ Labs"]
repository = "https://github.com/MorphIQ-Labs/tollgate"
# Refuses a stray `cargo publish` whatever tooling is driving. This is the plain
# `false`, never a registry list: a list makes release-plz run
# `cargo package --registry <name>`, which is what broke every main pipeline in
# #46. release-plz still tags private packages under `git_only = true`
# (0.3.152, PR #2603), so the guard costs nothing here.
publish = false

[workspace.dependencies]
# Time: jiff, not chrono/time — matches ferro-risk. The core crate takes
# timestamps as arguments and never reads a clock itself.
jiff = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Dev/bench
criterion = "0.5"
proptest = "1.7"

# Later members (admission/store/server/client) — declared centrally so every
# crate resolves the same versions.
arc-swap = "1"
# Wipes cached credential bytes on drop. Hand-rolled zeroing is what this
# crate exists to replace: a plain loop is dead-store-eliminable.
zeroize = "1"
async-trait = "0.1"
# The refill wake (#10). A single-purpose, dependency-free leaf crate already
# in the lockfile via hyper, so taking it directly compiles nothing new. It is
# deliberately not tokio's `Notify`: the signal is raised from inside a lease
# debit, on the request path, and `notify_one` takes an internal mutex when a
# waiter is parked — which is exactly our case, since the refill task is
# normally waiting.
atomic-waker = "1.1"
# The request path's map hasher (#9). `Principal` is a fingerprint of an
# already-verified credential, so its bits cannot be steered by a caller and
# SipHash's flooding resistance buys nothing there. foldhash is a
# zero-dependency leaf crate already compiled into tollgate-admission's own
# graph — governor -> hashbrown -> foldhash — so taking it directly adds no
# package, and it is the hasher hashbrown itself picked as its default.
foldhash = "0.2"
moka = { version = "0.12", features = ["sync"] }
governor = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
subtle = "2"

# Observability. `tracing` is a facade the control-plane libraries emit
# through; it already builds as a transitive dependency of sqlx, axum and
# reqwest, so taking it directly costs no additional crate. Only binaries
# (and event-capture tests) take `tracing-subscriber`: a library emits, an
# application decides where output goes. tollgate-core and
# tollgate-admission take neither — the request path stays free of logging
# exactly as it stays free of I/O.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Discarding a fallible call is how every silent failure in issue #36 got
# written: `let _ = fallible()` reads as deliberate and reviews as harmless.
# The library crates deny it, so the next one must either handle the error or
# say — in an `#[allow]` with a reason — why there is nothing to say.
# tollgate-core and tollgate-admission opt in too: they have no I/O to
# discard, so the rule costs them nothing and the exemption would only invite
# drift. The example service and the CI gate binaries opt out: their
# discarded results are load-driver and report-printing plumbing, where the
# rule would buy noise rather than failure visibility.
[workspace.lints.clippy]
let_underscore_must_use = "deny"

# Deployment profile for load-gate runs and production builds; kept separate so
# Criterion benches retain the default calibrated release codegen policy.
[profile.production]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
