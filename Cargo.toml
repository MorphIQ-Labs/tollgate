# Virtual workspace manifest. Every member inherits version, edition and license
# from [workspace.package]. The library crates set `publish = true` and ship to
# crates.io in lockstep; tooling and examples inherit `publish = false`.
[workspace]
resolver = "3"
members = [
    "crates/tollgate-admission",
    "crates/tollgate-alloc-count",
    "crates/tollgate-auth",
    "crates/tollgate-axum",
    "crates/tollgate-client",
    "crates/tollgate-core",
    "crates/tollgate-perf-gate",
    "crates/tollgate-repo-check",
    "crates/tollgate-server",
    "crates/tollgate-store",
    "crates/tollgate-store-postgres",
    "examples/pricing-api",
]

[workspace.package]
version = "0.32.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MorphIQ-Labs/tollgate"
# Refuses a stray `cargo publish` whatever tooling is driving. This is the plain
# `false`, never a registry list: a list makes release-plz run
# `cargo package --registry <name>`, which is what broke every main pipeline in
# GL-46. release-plz still tags private packages under `git_only = true`
# (0.3.152, PR GL-2603), so the guard costs nothing here.
publish = false

[workspace.dependencies]
# Time: jiff, not chrono/time. The core crate takes
# timestamps as arguments and never reads a clock itself.
jiff = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# Repository tooling parses Rust declarations, including macro token streams.
# Both packages already occur in Cargo.lock; this adds no runtime dependency.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
# The documentation site's link preprocessor parses Markdown the way mdBook
# does. Tooling only; no published crate depends on it.
pulldown-cmark = { version = "0.13", default-features = false }

# Dev/bench
criterion = "0.5"
proptest = "1.7"
tempfile = "3"
# Path only, never a version: it is a dev-dependency of published crates, and
# `cargo publish` strips a path-only dev-dependency but would require a
# versioned one to exist on crates.io. The crate itself is never published.
tollgate-alloc-count = { path = "crates/tollgate-alloc-count" }
# Axum/tower test scaffolding: `oneshot` against a built router, and the body
# collector that reads its response. Dev-only in every member that takes them.
http-body-util = "0.1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }

# Later members (admission/store/server/client) — declared centrally so every
# crate resolves the same versions.
arc-swap = "1"
# `v4` only, deliberately. `examples/pricing-api` adds `fast-rng` for its own
# reasons, stated there; the members that mint lease ids do not ask for it, so
# a standalone build of them keeps the getrandom-backed generator. Cargo
# unifies features across a `--workspace` build, so they do link `fast-rng`
# there — that is a property of the build graph, not a per-crate choice, and
# naming the split here is what keeps it from being made by accident.
uuid = { version = "1", features = ["v4"] }
# Wipes cached credential bytes on drop. Hand-rolled zeroing is what this
# crate exists to replace: a plain loop is dead-store-eliminable.
zeroize = "1"
async-trait = "0.1"
# The refill wake (GL-10). A single-purpose, dependency-free leaf crate already
# in the lockfile via hyper, so taking it directly compiles nothing new. It is
# deliberately not tokio's `Notify`: the signal is raised from inside a lease
# debit, on the request path, and `notify_one` takes an internal mutex when a
# waiter is parked — which is exactly our case, since the refill task is
# normally waiting.
atomic-waker = "1.1"
# The request path's map hasher (GL-9). `Principal` is a fingerprint of an
# already-verified credential, so its bits cannot be steered by a caller and
# SipHash's flooding resistance buys nothing there. foldhash is a
# zero-dependency leaf crate already compiled into tollgate-admission's own
# graph — governor -> hashbrown -> foldhash — so taking it directly adds no
# package, and it is the hasher hashbrown itself picked as its default.
foldhash = "0.2"
moka = { version = "0.12", features = ["sync"] }
governor = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Control-plane TLS and signed service identities (GL-98). No native TLS/OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.14"
sha2 = "0.10"
subtle = "2"

# Observability. `tracing` is a facade the control-plane libraries emit
# through; it already builds as a transitive dependency of sqlx, axum and
# reqwest, so taking it directly costs no additional crate. Only binaries
# (and event-capture tests) take `tracing-subscriber`: a library emits, an
# application decides where output goes. tollgate-core and
# tollgate-admission take neither — the request path stays free of logging
# exactly as it stays free of I/O.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Discarding a fallible call is how every silent failure in issue GL-36 got
# written: `let _ = fallible()` reads as deliberate and reviews as harmless.
# The library crates deny it, so the next one must either handle the error or
# say — in an `#[allow]` with a reason — why there is nothing to say.
# tollgate-core and tollgate-admission opt in too: they have no I/O to
# discard, so the rule costs them nothing and the exemption would only invite
# drift. The example service and the CI gate binaries opt out: their
# discarded results are load-driver and report-printing plumbing, where the
# rule would buy noise rather than failure visibility.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
# GL-19's enforcement says an `#[allow]` is acceptable "unless" it states why.
# That was a convention a reviewer had to notice; this makes it mechanical, the
# way the deny above already makes discarding a fallible call mechanical (GL-82).
allow_attributes_without_reason = "deny"

# Deployment profile for load-gate runs and production builds; kept separate so
# Criterion benches retain the default calibrated release codegen policy.
# Criterion's measurements are a recorded contract (`testing/perf_baseline.json`),
# so the profile they are taken under has to be reproducible across changes that
# do not touch the measured path. The default release profile is not: at
# `codegen-units = 16` rustc repartitions a crate whenever its code grows, and
# cross-unit inlining decisions move with it. GL-114 was that effect and nothing
# else -- `admission/snapshot_lookup_moka` read 66.92ns at `1a3a260` and 88.19ns
# at `f6aaa28` with its lookup path byte-identical, while one codegen unit put
# the same two revisions at 55.84ns and 56.40ns. One unit also measures what is
# actually deployed, since `production` below compiles the same way.
[profile.bench]
codegen-units = 1

[profile.production]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
