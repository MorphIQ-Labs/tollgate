[package]
name = "pricing-api"
description = "Example concrete web service built on the tollgate stack: HMAC-verified API keys, one-call admission, commit-at-execution-start charging, and batched usage accounting around a toy pricing kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
tollgate-core = { path = "../../crates/tollgate-core" }
tollgate-admission = { path = "../../crates/tollgate-admission" }
tollgate-client = { path = "../../crates/tollgate-client" }
tollgate-store = { path = "../../crates/tollgate-store" }
axum = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
# fast-rng: v4 ids from a userspace CSPRNG seeded once — a getrandom
# syscall per request measurably regressed the loopback overhead gate.
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pricing-api"
path = "src/main.rs"

[[bin]]
name = "load_gate"
path = "src/bin/load_gate.rs"
