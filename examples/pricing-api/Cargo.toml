[package]
name = "pricing-api"
description = "Example concrete web service built on the tollgate stack: connection-cached HMAC-verified API keys, one-call admission, commit-at-execution-start charging, and batched usage accounting around a toy pricing kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tollgate-core = { path = "../../crates/tollgate-core", version = "=0.8.3" }
tollgate-admission = { path = "../../crates/tollgate-admission", version = "=0.8.3" }
tollgate-client = { path = "../../crates/tollgate-client", version = "=0.8.3" }
tollgate-store = { path = "../../crates/tollgate-store", version = "=0.8.3" }
tollgate-auth = { path = "../../crates/tollgate-auth", version = "=0.8.3" }
axum = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# fast-rng: v4 ids from a userspace CSPRNG seeded once — a getrandom
# syscall per request measurably regressed the loopback overhead gate.
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pricing-api"
path = "src/main.rs"

[[bin]]
name = "load_gate"
path = "src/bin/load_gate.rs"
