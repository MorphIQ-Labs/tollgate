[package]
name = "pricing-api"
description = "Example concrete web service built on the tollgate stack: connection-cached HMAC-verified API keys, one-call admission, commit-at-execution-start charging, and batched usage accounting around a toy pricing kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tollgate-core = { path = "../../crates/tollgate-core", version = "=0.30.2" }
tollgate-admission = { path = "../../crates/tollgate-admission", version = "=0.30.2" }
tollgate-client = { path = "../../crates/tollgate-client", version = "=0.30.2" }
tollgate-store = { path = "../../crates/tollgate-store", version = "=0.30.2" }
tollgate-auth = { path = "../../crates/tollgate-auth", version = "=0.30.2" }
axum = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# fast-rng: v4 ids from a userspace CSPRNG seeded once — a getrandom
# syscall per request measurably regressed the loopback overhead gate.
uuid = { workspace = true, features = ["fast-rng"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
http-body-util = { workspace = true }
tower = { workspace = true }

[[bin]]
name = "pricing-api"
path = "src/main.rs"

[[bin]]
name = "load_gate"
path = "src/bin/load_gate.rs"

[[example]]
name = "load_gate_failure_probe"
path = "tests/fixtures/load_gate_failure_probe.rs"
test = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
let_underscore_must_use = "allow"
