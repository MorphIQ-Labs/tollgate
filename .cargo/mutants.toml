# Mutation testing is an executable check that assertions pin the behavior
# changed by a branch. Every MISSED or TIMEOUT outcome fails; equivalent
# mutants must be excluded narrowly here with a proof or invariant reference.
additional_cargo_args = ["--all-features"]
test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]
test_workspace = true
timeout_multiplier = 4.0
minimum_test_timeout = 60

exclude_re = [
  # Formatting has no authorization, accounting, or operational semantics.
  "impl (std::)?fmt::(Debug|Display)",
  # Both backends clamp an over-long TTL: `if ttl > max_ttl { max_ttl } else {
  # ttl }`. Widening that to `>=` changes only the case `ttl == max_ttl`, where
  # both arms yield the same duration. Not "hard to test" — there is no input
  # that separates them, so a test claiming to would be asserting on the
  # branch rather than on behaviour. The clamp itself *was* unwitnessed, and
  # now is: `a_ttl_beyond_the_policy_maximum_is_clamped`, in both backend
  # suites. Memory was baselined by GL-43 and PostgreSQL by GL-50.
  "replace > with >= in <impl LeaseAllocator for MemoryStore>::acquire",
  "replace > with >= in <impl LeaseAllocator for PostgresStore>::acquire",
  # `SnapshotMap`'s compatibility default spells the same value as
  # `LocalSharding::default()`: both are `LocalSharding::SINGLE`. Sharded maps
  # override the method, and `the_arc_delegation_forwards_every_bulk_write`
  # proves that a non-default value survives dynamic dispatch. No input can
  # distinguish these two bodies.
  "replace SnapshotMap::local_sharding -> LocalSharding with Default::default\\(\\)",
  # `Connected::connect_info` must create the default empty per-connection
  # cache (INVARIANTS.md GL-23). Replacing the explicit `Self::default()` with
  # inferred `Default::default()` calls the same implementation and returns
  # the same type; no request or connection can distinguish the spellings.
  "replace <impl Connected<axum::serve::IncomingStream<'_, tokio::net::TcpListener>> for PricingConnection>::connect_info -> Self with Default::default\\(\\)",
  # `ConcurrencyGauge::release_shard` short-circuits on
  # `decrement() == 0 && phase == DRAINING` before calling
  # `promote_if_drained`, whose own guard — `phase == DRAINING &&
  # shards.is_empty()`, over a compare-exchange — is where the transition's
  # precondition actually lives. Widening the `&&` to `||` adds exactly two
  # call cases, `decrement() != 0 && phase == DRAINING` and
  # `decrement() == 0 && phase != DRAINING`, and both fail that precondition,
  # so the extra calls are no-ops. Proved as
  # `promote_outside_its_precondition_is_a_no_op` in
  # `formal/lean/Tollgate/ConcurrencyGauge.lean`; no input separates the two
  # spellings. The guard is a cost contract — it keeps the ordinary release
  # path off an O(shards) scan — and cost is what the performance gates
  # measure, not what a mutation test can observe.
  "replace && with \\|\\| in ConcurrencyGauge::release_shard",
  # Whole entry-point replacement is outside this gate's generated mutations.
  # Operational logic lives in tested helpers; binary integration tests
  # separately witness startup, feature selection and diagnostic failures.
  # This exclusion does not establish mutation coverage for those entry points.
  "replace main -> ",
  # `PostgresStore::roll_due_periods` runs one statement per `Period` variant
  # and keeps the batch within `limit` across them:
  #     let remaining = limit_i - i64::try_from(rolled.len())?;
  # `Period::ALL` holds exactly one variant today, so the loop body runs once
  # with `rolled.len() == 0`, and `limit - 0` and `limit + 0` are the same
  # number. No input separates them: reaching the second iteration requires a
  # second period kind, which does not exist. The loop is written this way
  # regardless, because a second variant is due at a different instant and
  # needs its own statement.
  #
  # This exclusion retires itself. `every_period_is_swept` matches
  # exhaustively over `Period`, so adding a variant stops the workspace
  # compiling until someone visits `Period::ALL` — and the mutant becomes
  # killable at exactly that moment, by any test that fills a batch from the
  # first period and expects the second to respect what is left.
  "replace - with \\+ in <impl AdminStore for PostgresStore>::roll_due_periods",
]
