[package]
name = "tollgate-auth"
description = "Credential verification for latency-critical services: digests at rest, and a session-scoped cache that removes the per-request digest without widening the revocation window."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["authentication", "api-key", "hmac", "session", "credentials"]
categories = ["authentication", "web-programming"]

[lints]
workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.30.0" }
arc-swap = { workspace = true }
jiff = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tollgate-alloc-count = { workspace = true }

[[bench]]
name = "credential_verification"
harness = false
