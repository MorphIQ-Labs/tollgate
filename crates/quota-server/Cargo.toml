[package]
name = "quota-server"
description = "Control-plane HTTP service: fenced lease allocation, snapshot distribution, idempotent usage ingest, and account administration over any store backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
quota-core = { path = "../quota-core", features = ["serde"] }
quota-store = { path = "../quota-store", features = ["wire"] }
axum = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quota-admission = { path = "../quota-admission" }
quota-client = { path = "../quota-client", features = ["http"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
