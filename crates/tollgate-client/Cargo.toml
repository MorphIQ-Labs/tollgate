[package]
name = "tollgate-client"
description = "Instance-side quota runtime: background lease refill into the admission layer's LeaseSlot, and a bounded, batched, shed-on-overflow usage writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.4.0" }
tollgate-admission = { path = "../tollgate-admission", version = "=0.4.0" }
tollgate-store = { path = "../tollgate-store", version = "=0.4.0" }
async-trait = { workspace = true }
atomic-waker = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# The indexed resolution set (#22) must answer exactly what the scans it
# replaced answered; a property test against a naive reference is the only way
# to cover the interleavings the fixed tests do not reach.
proptest = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Event capture: the tests assert that a failure is reported, so the events
# are behavior rather than decoration. Subscribers stay out of the library.
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[features]
# HTTP transport implementing the store traits against a tollgate-server —
# the "via-server" topology. Off by default: the direct-store topology
# needs none of it.
http = ["dep:reqwest", "tollgate-store/wire"]

# Control-plane scaling, reported but not gated: unlike the request-path
# benches this one is not in testing/perf_thresholds.json, because its
# absolute numbers are host-dependent and the point is the curve's shape.
[[bench]]
name = "readiness_scaling"
harness = false

[lints]
workspace = true
