[package]
name = "tollgate-client"
description = "Instance-side quota runtime: background lease refill into the admission layer's LeaseSlot, and a bounded, batched, shed-on-overflow usage writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.1.3" }
tollgate-admission = { path = "../tollgate-admission", version = "=0.1.3" }
tollgate-store = { path = "../tollgate-store", version = "=0.1.3" }
async-trait = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Event capture: the tests assert that a failure is reported, so the events
# are behavior rather than decoration. Subscribers stay out of the library.
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[features]
# HTTP transport implementing the store traits against a tollgate-server —
# the "via-server" topology. Off by default: the direct-store topology
# needs none of it.
http = ["dep:reqwest", "tollgate-store/wire"]

[lints]
workspace = true
