[package]
name = "tollgate-perf-gate"
description = "Benchmark threshold checker: compares Criterion estimates against testing/perf_thresholds.json and fails the gate on regression or stale output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `--record` stamps a recorded baseline with the instant it was measured.
# The workspace's clock everywhere else, rather than hand-rolled civil-date
# arithmetic in a tool that must not be the thing that is wrong.
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
let_underscore_must_use = "allow"

[[bin]]
name = "check_benchmark_thresholds"
path = "src/main.rs"
