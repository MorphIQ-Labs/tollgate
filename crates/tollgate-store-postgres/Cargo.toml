[package]
name = "tollgate-store-postgres"
description = "PostgreSQL backend for tollgate: transactional fenced lease allocation, idempotent usage ingest, and snapshot storage implementing the tollgate-store traits."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Destructive fixture reset and query-plan inspection are explicit test APIs.
test-support = []

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.30.0", features = ["serde"] }
tollgate-store = { path = "../tollgate-store", version = "=0.30.0", features = ["wire"] }
async-trait = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Runtime-checked queries only (sqlx::query, not query!): the workspace must
# build without a DATABASE_URL. The correctness suite runs against a live
# Postgres when TOLLGATE_PG_URL is set (see docker-compose.yml).
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Enable helpers for this package's integration tests, never normal consumers.
tollgate-store-postgres = { path = ".", version = "=0.30.0", default-features = false, features = ["test-support"] }
criterion = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# Control-plane database latency, reported but not gated: the absolute result
# depends on the PostgreSQL host and connection path. This benchmark exists to
# compare the per-record update shape against the set-wise ingest shape on the
# same database.
[[bench]]
name = "ingest"
harness = false

[lints]
workspace = true
