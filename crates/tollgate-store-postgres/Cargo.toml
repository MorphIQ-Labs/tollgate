[package]
name = "tollgate-store-postgres"
description = "PostgreSQL backend for tollgate: transactional fenced lease allocation, idempotent usage ingest, and snapshot storage implementing the tollgate-store traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.12.0", features = ["serde"] }
tollgate-store = { path = "../tollgate-store", version = "=0.12.0", features = ["wire"] }
async-trait = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Runtime-checked queries only (sqlx::query, not query!): the workspace must
# build without a DATABASE_URL. The correctness suite runs against a live
# Postgres when TOLLGATE_PG_URL is set (see docker-compose.yml).
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# Control-plane database latency, reported but not gated: the absolute result
# depends on the PostgreSQL host and connection path. This benchmark exists to
# compare the per-record update shape against the set-wise ingest shape on the
# same database.
[[bench]]
name = "ingest"
harness = false

[lints]
workspace = true
