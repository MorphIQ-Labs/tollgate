[package]
name = "quota-store-postgres"
description = "PostgreSQL backend for quota-service: transactional fenced lease allocation, idempotent usage ingest, and snapshot storage implementing the quota-store traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
quota-core = { path = "../quota-core", features = ["serde"] }
quota-store = { path = "../quota-store", features = ["wire"] }
async-trait = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
# Runtime-checked queries only (sqlx::query, not query!): the workspace must
# build without a DATABASE_URL. The correctness suite runs against a live
# Postgres when QUOTA_PG_URL is set (see docker-compose.yml).
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
