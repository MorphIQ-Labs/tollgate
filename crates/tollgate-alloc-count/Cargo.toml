[package]
name = "tollgate-alloc-count"
description = "Test-only scoped allocation counter for Tollgate embedding regression gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# This crate is the workspace's one audited unsafe boundary: implementing
# GlobalAlloc is itself unsafe. It is linked only as a dev-dependency; every
# production crate inherits the workspace-level unsafe_code = "forbid".
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
let_underscore_must_use = "deny"
