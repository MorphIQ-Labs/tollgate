[package]
name = "tollgate-axum"
description = "Axum integration for Tollgate's local quota admission and usage accounting."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["axum", "quota", "metering", "billing"]
categories = ["web-programming", "asynchronous"]

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.32.1" }
tollgate-admission = { path = "../tollgate-admission", version = "=0.32.1" }
tollgate-auth = { path = "../tollgate-auth", version = "=0.32.1" }
tollgate-client = { path = "../tollgate-client", version = "=0.32.1" }
axum = { workspace = true }
http-body-util = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
http-body = { workspace = true }
tollgate-store = { path = "../tollgate-store", version = "=0.32.1" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }

[lints]
workspace = true
