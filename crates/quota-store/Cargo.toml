[package]
name = "quota-store"
description = "Storage abstraction for quota-service: LeaseAllocator, SnapshotSource, and UsageSink traits, plus the in-memory reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
quota-core = { path = "../quota-core" }
async-trait = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
# The HTTP wire contract shared by quota-server and quota-client's HTTP
# transport. Feature-gated so store-only consumers skip serde entirely.
wire = ["dep:serde", "quota-core/serde"]
