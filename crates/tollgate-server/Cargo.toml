[package]
name = "tollgate-server"
description = "Control-plane HTTP service: fenced lease allocation, snapshot distribution, idempotent usage ingest, and account administration over any store backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
postgres = ["dep:tollgate-store-postgres"]
# Weak forwarding preserves the no-Postgres server build, including its tests.
test-support = ["tollgate-store-postgres?/test-support"]

[dependencies]
tollgate-auth = { path = "../tollgate-auth", version = "=0.22.0" }
arc-swap = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
tollgate-core = { path = "../tollgate-core", version = "=0.22.0", features = ["serde"] }
tollgate-store = { path = "../tollgate-store", version = "=0.22.0", features = ["wire"] }
tollgate-store-postgres = { path = "../tollgate-store-postgres", version = "=0.22.0", optional = true }
axum = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
# A binary decides where output goes; the library half only emits.
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Test-only self edge: ordinary test commands opt in without production builds doing so.
tollgate-server = { path = ".", version = "=0.22.0", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
rcgen = { workspace = true }
async-trait = { workspace = true }
tollgate-admission = { path = "../tollgate-admission", version = "=0.22.0" }
tollgate-client = { path = "../tollgate-client", version = "=0.22.0", features = ["http"] }
http-body-util = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
