[package]
name = "tollgate-server"
description = "Control-plane HTTP service: fenced lease allocation, snapshot distribution, idempotent usage ingest, and account administration over any store backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.1.4", features = ["serde"] }
tollgate-store = { path = "../tollgate-store", version = "=0.1.4", features = ["wire"] }
tollgate-store-postgres = { path = "../tollgate-store-postgres", version = "=0.1.4" }
axum = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# A binary decides where output goes; the library half only emits.
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tollgate-admission = { path = "../tollgate-admission", version = "=0.1.4" }
tollgate-client = { path = "../tollgate-client", version = "=0.1.4", features = ["http"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
