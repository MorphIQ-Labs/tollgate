[package]
name = "tollgate-store"
description = "Storage abstraction for tollgate: LeaseAllocator, SnapshotSource, and UsageSink traits, plus the in-memory reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.10.1" }
async-trait = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Wire-contract tests only: `wire.rs` decides what goes on the network, so what
# it serializes is checked rather than asserted (#20).
serde_json = { workspace = true }
# Event-capture tests only, matching tollgate-client: a library emits, and only
# a test or an application installs a subscriber to observe it.
tracing-subscriber = { workspace = true }
# Account-status transitions only (#51): the two records must agree after every
# sequence of transitions, not just the ones a scenario happened to write.
proptest = { workspace = true }

[features]
# The HTTP wire contract shared by tollgate-server and tollgate-client's HTTP
# transport. Feature-gated so store-only consumers skip serde entirely.
wire = ["dep:serde", "tollgate-core/serde"]

[lints]
workspace = true
