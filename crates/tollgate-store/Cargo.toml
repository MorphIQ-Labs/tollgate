[package]
name = "tollgate-store"
description = "Storage abstraction for tollgate: LeaseAllocator, SnapshotSource, and UsageSink traits, plus the in-memory reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tollgate-core = { path = "../tollgate-core", version = "=0.1.1" }
async-trait = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
# The HTTP wire contract shared by tollgate-server and tollgate-client's HTTP
# transport. Feature-gated so store-only consumers skip serde entirely.
wire = ["dep:serde", "tollgate-core/serde"]
