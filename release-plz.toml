# Git-only release configuration. Merging the release-plz merge request creates
# the workspace tag; no package is published to a registry.

[workspace]
publish = false
git_only = true
release_always = false
semver_check = true
# `v0.1.0` predates packageable workspace manifests. The namespaced series is
# the reproducible release baseline for this multi-crate workspace.
git_tag_name = "tollgate-v{{ version }}"
git_release_name = "tollgate-v{{ version }}"
changelog_update = false

# tollgate-core owns the shared version, changelog, tag, and GitLab release.
# Other members inherit the workspace version and feed the root changelog, but
# are not independently compared or released.
[[package]]
name = "tollgate-core"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
  "pricing-api",
  "tollgate-admission",
  "tollgate-client",
  "tollgate-perf-gate",
  "tollgate-server",
  "tollgate-store",
  "tollgate-store-postgres",
]

[[package]]
name = "tollgate-admission"
release = false

[[package]]
name = "tollgate-client"
release = false

[[package]]
name = "tollgate-perf-gate"
release = false

[[package]]
name = "tollgate-server"
release = false

[[package]]
name = "tollgate-store"
release = false

[[package]]
name = "tollgate-store-postgres"
release = false

[[package]]
name = "pricing-api"
release = false
